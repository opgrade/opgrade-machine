[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opgrade"
version = "0.1.0"
description = "OpGrade X — logiciel embarqué de gradation de cartes de collection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opgrade = ["web/*", "rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
